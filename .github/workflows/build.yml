name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # android-actions/setup-android@v3은 더 이상 존재하지 않는 'tools' 패키지를
      # 설치하려다 실패한다. 러너 이미지에 SDK가 이미 들어 있으므로 직접 준비한다.
      - name: Android SDK 준비
        env:
          COMPILE_SDK: "35"
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-(비어 있음)}"
          echo "설치된 플랫폼:"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "  (없음)"
          if [ ! -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK" ]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
            echo "android-$COMPILE_SDK 이 없어 설치합니다 ($sdkmanager)"
            yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
            "$sdkmanager" "platforms;android-$COMPILE_SDK"
          fi

      - uses: gradle/actions/setup-gradle@v4

      # :core는 순수 Kotlin/JVM이라 SDK 없이도 돌지만, 여기서는 SDK가 있으므로
      # :app까지 함께 빌드한다. 이 잡이 :app의 유일한 컴파일 검증이다.
      - name: core 단위 테스트
        run: ./gradlew :core:test --console=plain

      - name: APK 빌드
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: myna-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
