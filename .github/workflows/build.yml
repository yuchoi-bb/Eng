name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # :core는 순수 Kotlin/JVM이라 SDK 없이도 돌지만, 여기서는 SDK가 있으므로
      # :app까지 함께 빌드한다. 이 잡이 :app의 유일한 컴파일 검증이다.
      - name: core 단위 테스트
        run: ./gradlew :core:test --console=plain

      - name: APK 빌드
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: eng-shadowing-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
