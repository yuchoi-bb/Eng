name: core tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # :core는 순수 Kotlin/JVM이라 Android SDK 없이 돌아간다.
      # settings.gradle.kts가 SDK 부재를 감지해 :app을 제외하므로 이 잡은 그대로 통과한다.
      - name: core 단위 테스트
        run: ./gradlew :core:test --console=plain

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
