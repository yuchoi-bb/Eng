name: release

# 릴리즈는 **VERSION 파일을 고쳐 푸시하면** 나간다. Actions 탭에서 수동 실행해도 된다.
#
# 태그 푸시를 트리거로 두지 않는 이유가 둘 있다.
#   - 이 저장소에 푸시하는 경로 중에는 태그 ref를 밀 수 없는 것이 있다(브랜치만 허용).
#   - push 트리거에서 paths와 tags를 함께 걸면 서로 상쇄된다. 태그 푸시에는 경로 차이가
#     없으므로 paths 필터를 만족시키지 못한다.
#
# 태그는 러너가 직접 만들어 밀므로(아래 '릴리즈 게시') 결과는 같다.
on:
  push:
    paths: ["VERSION"]
  workflow_dispatch:
    inputs:
      tag:
        description: "붙일 태그 (예: v0.1.0). 없으면 VERSION 파일을 읽는다"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # android-actions/setup-android@v3은 더 이상 존재하지 않는 'tools' 패키지를
      # 설치하려다 실패한다. 러너 이미지에 SDK가 이미 들어 있으므로 직접 준비한다.
      - name: Android SDK 준비
        env:
          COMPILE_SDK: "35"
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-(비어 있음)}"
          echo "설치된 플랫폼:"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "  (없음)"
          if [ ! -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK" ]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
            echo "android-$COMPILE_SDK 이 없어 설치합니다 ($sdkmanager)"
            yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
            "$sdkmanager" "platforms;android-$COMPILE_SDK"
          fi

      - uses: gradle/actions/setup-gradle@v4

      # 릴리즈에 깨진 빌드를 올리지 않도록 테스트를 먼저 돌린다.
      - name: core 단위 테스트
        run: ./gradlew :core:test --console=plain

      - name: APK 빌드
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 태그 결정
        id: tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag || '' }}" ]; then
            tag="${{ inputs.tag || '' }}"
          elif [ -f VERSION ]; then
            tag="v$(tr -d '[:space:]' < VERSION)"
          else
            echo "태그를 정할 수 없습니다. VERSION 파일이 없습니다." >&2
            exit 1
          fi
          echo "태그: $tag"
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: APK 이름 붙이기
        id: apk
        run: |
          src=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$src" ]; then
            echo "APK를 찾지 못했습니다." >&2
            exit 1
          fi
          out="eng-shadowing-${{ steps.tag.outputs.name }}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$out" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 릴리즈 노트 작성
        run: |
          cat > release-notes.md <<'NOTES'
          ## 설치

          아래 APK를 안드로이드 기기에서 내려받아 설치합니다.
          "출처를 알 수 없는 앱" 설치를 한 번 허용해야 합니다.

          ## 서명

          레포에 담긴 **고정 디버그 키스토어**로 서명했습니다. 빌드마다 서명이 같으므로
          기존 앱 위에 덮어쓰기로 설치되고, 학습 기록이 유지됩니다.

          Play Store 업로드용 키가 아닙니다. 스토어 배포는 S1에서 별도 업로드 키로 진행합니다.

          ## 범위

          S0 (REQUIREMENTS §11.1) — 영상 업로드 + 수동 문장 입력 + 예산 기반 반복 세션 +
          쉐도잉 3단계 모드. 외부 API를 쓰지 않으므로 유튜브 경로와 발음 채점은 아직 없습니다.
          NOTES
          {
            echo ""
            echo "## 검증"
            echo ""
            echo '```'
            echo "커밋    ${GITHUB_SHA}"
            echo "SHA-256 ${{ steps.apk.outputs.sha256 }}"
            echo '```'
          } >> release-notes.md

      - name: 릴리즈 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.name }}"
          # 태그가 없으면 현재 커밋에 만든다.
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag"
            git push origin "$tag"
          fi
          # 같은 태그로 다시 돌리면 자산만 갈아 끼운다.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$tag" "${{ steps.apk.outputs.path }}" \
              --title "$tag" --notes-file release-notes.md
          fi
