name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "붙일 태그 (예: v0.1.0). 없으면 커밋 해시로 만든다"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # 릴리즈에 깨진 빌드를 올리지 않도록 테스트를 먼저 돌린다.
      - name: core 단위 테스트
        run: ./gradlew :core:test --console=plain

      - name: APK 빌드
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 태그 결정
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=build-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: APK 이름 붙이기
        id: apk
        run: |
          src=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$src" ]; then
            echo "APK를 찾지 못했습니다." >&2
            exit 1
          fi
          out="eng-shadowing-${{ steps.tag.outputs.name }}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$out" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 릴리즈 노트 작성
        run: |
          cat > release-notes.md <<'NOTES'
          ## 설치

          아래 APK를 안드로이드 기기에서 내려받아 설치합니다.
          "출처를 알 수 없는 앱" 설치를 한 번 허용해야 합니다.

          ## 서명

          레포에 담긴 **고정 디버그 키스토어**로 서명했습니다. 빌드마다 서명이 같으므로
          기존 앱 위에 덮어쓰기로 설치되고, 학습 기록이 유지됩니다.

          Play Store 업로드용 키가 아닙니다. 스토어 배포는 S1에서 별도 업로드 키로 진행합니다.

          ## 범위

          S0 (REQUIREMENTS §11.1) — 영상 업로드 + 수동 문장 입력 + 예산 기반 반복 세션 +
          쉐도잉 3단계 모드. 외부 API를 쓰지 않으므로 유튜브 경로와 발음 채점은 아직 없습니다.
          NOTES
          {
            echo ""
            echo "## 검증"
            echo ""
            echo '```'
            echo "커밋    ${GITHUB_SHA}"
            echo "SHA-256 ${{ steps.apk.outputs.sha256 }}"
            echo '```'
          } >> release-notes.md

      - name: 릴리즈 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          # 태그가 없으면 현재 커밋에 만든다 (workflow_dispatch 경로).
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag"
            git push origin "$tag"
          fi
          flags=""
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
            flags="--prerelease"
          fi
          # 같은 태그로 다시 돌리면 자산만 갈아 끼운다.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$tag" "${{ steps.apk.outputs.path }}" \
              --title "$tag" --notes-file release-notes.md $flags
          fi
